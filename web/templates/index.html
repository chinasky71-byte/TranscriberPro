{% extends "base.html" %}
{% block content %}
<section class="card hero">
  <div id="queue" hx-get="/ui/queue" hx-trigger="every 2s" hx-swap="innerHTML">
    {% include "_queue.html" %}
  </div>
</section>

{% if search_enabled %}
<section class="card">
  <h2>Search the library</h2>
  <form id="search-form" class="row" hx-get="/ui/search" hx-target="#search-results"
        hx-swap="innerHTML"
        hx-trigger="submit, keyup changed delay:400ms from:input[name='term'], search-again">
    <input name="term" placeholder="Series or film title, e.g. Outlander" autocomplete="off">
    <button class="btn small" type="submit">Search</button>
  </form>
  <div id="search-results"></div>
</section>
{% endif %}

<section class="card">
  <h2>Add to queue</h2>
  <form class="stack" hx-post="/ui/jobs" hx-target="#queue" hx-swap="innerHTML">
    <label>Media path
      <input name="path" placeholder="/media/film.mkv" autocomplete="off">
    </label>
    <div class="picker-wrap">
      <div class="picker-head">
        <strong>Pick the files to process</strong>
        <button class="btn small" type="button"
                hx-get="/ui/browse" hx-target="#picker"
                hx-swap="innerHTML">Reload the list</button>
      </div>
      <div id="picker" class="picker-body"
           hx-get="/ui/browse" hx-trigger="load" hx-swap="innerHTML">
        <p class="muted">Loading the folders…</p>
      </div>
    </div>
    <div class="row">
      <label>Target language
        <select name="target_language">
          <option value="">default</option>
          {% for language in languages %}<option value="{{ language }}">{{ language }}</option>{% endfor %}
        </select>
      </label>
    </div>
    <div class="checks">
      <label><input type="checkbox" name="force_audio" value="true"> Force audio</label>
      <label><input type="checkbox" name="mux" value="true"> Mux into video</label>
      <label><input type="checkbox" name="upload" value="true"> Upload</label>
      <label><input type="checkbox" name="gender" value="true"> Gender correction</label>
      <label><input type="checkbox" name="allow_cpu" value="true"> Allow CPU (very slow, only if the GPU check fails)</label>
      <label><input type="checkbox" name="skip_existing" value="true"> Skip files that already have a subtitle</label>
    </div>
    <button class="btn primary" type="submit">Add</button>
  </form>
</section>

<section class="card" id="logs-panel"
         x-data="{open: false}"
         x-on:tp-logs-open.window="open = true"
         x-on:tp-logs-close.window="open = false"
         x-show="open">
  <div class="row between">
    <h2>Logs — <span id="logs-title"></span></h2>
    <button class="btn ghost" id="logs-close" type="button">Close</button>
  </div>
  <pre id="logs" class="logs"></pre>
</section>
{% endblock %}
