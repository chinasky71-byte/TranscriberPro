<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcriber Pro</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Transcriber Pro</div>
    <nav class="top-actions">
      <a class="link" href="/">Dashboard</a>
      <a class="link" href="/history">History</a>
      <a class="link" href="/ocr">OCR</a>
      <a class="link" href="/settings">Settings</a>
      <a class="link" href="/docs">API</a>
      {% if status is defined and status.auth_enabled %}
      <form method="post" action="/logout" class="inline">
        <button class="btn ghost" type="submit">Logout</button>
      </form>
      {% endif %}
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
