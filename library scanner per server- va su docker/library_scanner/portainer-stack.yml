services:
  library-scanner:
    image: library-scanner:latest
    container_name: library-scanner
    restart: unless-stopped
    ports:
      - "6680:6680"
    volumes:
      - /opt/library_scanner/data:/app/data
      # Aggiungi qui i mount dei dischi dopo aver verificato i percorsi nell'LXC, es:
      # - "/mnt/tuoi_dischi/MOVIES:/mnt/movies:ro"
      # - "/mnt/tuoi_dischi/FILM_2:/mnt/film2:ro"
      # - "/mnt/tuoi_dischi/TV SHOWS:/mnt/tvshows:ro"
    environment:
      - TZ=Europe/Rome
      - SCANNER_DB_PATH=/app/data/db/library_scanner.db
      - SCANNER_LOG_PATH=/app/data/logs
      - SCANNER_PORT=6680
      - SCANNER_ADMIN_USER=admin
      - SCANNER_ADMIN_PASSWORD=0vvP6AYhO6idK_C4uvSvEg
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
