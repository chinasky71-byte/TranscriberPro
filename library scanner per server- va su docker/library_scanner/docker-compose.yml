services:
  library-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-scanner
    restart: unless-stopped
    ports:
      - "6680:6680"
    volumes:
      - /opt/library_scanner/data:/app/data
      - "/srv/dev-disk-by-uuid-9fbd521b-2449-4c25-ad0e-dd7d6ff2503f/FILM_2:/mnt/film2"
    environment:
      - TZ=Europe/Rome
      - SCANNER_DB_PATH=/app/data/db/library_scanner.db
      - SCANNER_LOG_PATH=/app/data/logs
