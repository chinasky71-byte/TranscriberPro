# /var/tmp e' su disco: senza --basetemp pytest usa /tmp, che qui e' tmpfs (RAM).
# Con un basetemp fisso pytest svuota la cartella a ogni run (niente accumulo).
[pytest]
addopts = -p no:cacheprovider --basetemp=/var/tmp/tp-pytest
python_files = test_*.py
filterwarnings =
    ignore::DeprecationWarning
